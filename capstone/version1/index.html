<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone Version 1</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- css libraries here -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="styles.css" rel="stylesheet">

    <!-- javascript librarires here -->

    <script src="script.js" defer></script>
</head>
<body>
    

    <header class="showing">
        <h1>Seabnb</h1>
        <h2>Explore and Rate Floating Cities!</h2>
        <button type="button" id="start">START</button>
        <button type="button" id="fyi">For more information</button>
    </header>
    

    <section id="backstory" class="hidden">
        <h2>your story...</h2>
        <!-- Div below is for story images -->
        <div id="slideshow"></div>
        <div >
            <p>Living close to the ocean means everything to you.</p>
        </div>
        <i class="fa-solid fa-computer-mouse"></i>
    </section>

    <section id="onboarding" class="hidden">
        <div class="textbox">
            <p>
                Hi, I'm Savi the Sea Turtle! I'm here to help you choose a floating city to live in!
            </p>
        </div>
    </section>

    <section id="location-select" class="hidden">
        <div id="map">
            <img src="images/map.png" alt="map of Asia">
            <i class="fa-solid fa-location-pin" id="pin1"></i>
            <i class="fa-solid fa-location-pin" id="pin2"></i>
           <i class="fa-solid fa-location-pin" id="pin3"></i> 
        </div>
         
        <div id="map-textbox">
            <p>
                Choose a floating city to explore!
            </p>
            <button type="button" class="hidden">Done Exploring</button>
        </div>
    </section>

    <section id="maldives" class="hidden">
        <h2>Maldives Floating City</h2>
    </section>

    <section id="oceanix" class="hidden">
        <h2>Oceanix Busan</h2>
    </section>

    <section id="dogen" class="hidden">
        <h2>Dogen City</h2>
    </section>
</body>
</html>
